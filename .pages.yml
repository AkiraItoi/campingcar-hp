media:
  input: img/spots
  output: /img/spots
  categories: [image]
content:
  - name: spots
    label: おすすめスポット
    type: file
    path: data/spots.json
    format: json
    list: true
    fields:
      - name: title
        label: 施設名
        type: string
        required: true
        options:
          maxlength: 60
      - name: category
        label: 種類
        type: select
        required: true
        options:
          values:
            - name: stay
              label: 車中泊スポット・キャンプ場
            - name: play
              label: 日中の遊び場
      - name: image
        label: 自分で撮影した写真
        type: image
        required: true
        options:
          extensions: [jpg, jpeg, png, webp]
          rename: random
      - name: comment
        label: 一言コメント
        type: text
        required: true
        options:
          maxlength: 140
      - name: url
        label: 施設の公式サイトURL
        type: string
        required: true
        pattern:
          regex: "^https://.+"
          message: "https://で始まる公式サイトURLを入力してください"
      - name: instagram
        label: Instagram投稿URL（任意）
        type: string
      - name: facebook
        label: Facebook投稿URL（任意）
        type: string
      - name: published
        label: LPに掲載する
        type: boolean
        default: false
