media:
  input: img/spots
  output: /img/spots
  categories: [image]
  extensions: [jpg, jpeg, png, webp]
  rename: false

content:
  - name: spots
    label: おすすめスポット
    type: file
    path: data/spots.json
    format: json
    list: true
    fields:
      - name: title
        label: 施設名
        type: string
        required: true
        options:
          maxlength: 60

      - name: category
        label: 区分
        type: select
        required: true
        options:
          values:
            - name: stay
              label: 車中泊スポット
            - name: camp
              label: キャンプ場
            - name: play
              label: 遊び場

      - name: image
        label: 写真
        type: image
        required: true
        options:
          extensions: [jpg, jpeg, png, webp]
          rename: false

      - name: comment
        label: 短いコメント
        type: text
        required: true
        options:
          maxlength: 140

      - name: url
        label: 施設の公式サイトURL
        type: string
        required: true
        pattern:
          regex: "^https://.+"
          message: "https://で始まる公式サイトURLを入力してください"

      - name: private
        label: プライベートキャンプ場
        type: boolean
        default: false

      - name: published
        label: HPに掲載する
        type: boolean
        default: false
