<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約リクエスト・料金確認｜SUN AID</title>
  <link rel="stylesheet" href="style.css?v=20261010-2">
</head>
<body class="reserve-page">

  <main class="page">

    <section class="price" id="reservePriceSection">
      <div class="reserve-request-notice">
        <h2>予約リクエスト・料金確認</h2>
        <p class="reserve-request-alert"><strong>この時点では、まだ予約は確定しません。</strong></p>
        <p class="reserve-request-flow">当社が空き状況と内容を確認し、予約確定の連絡を送信した時点で予約成立となります。</p>
      </div>

      <div class="reserve-step-header" id="reserveStepHeader">
        <button type="button" class="reserve-step is-active" id="reserveStepStart">① 開始日時を選択</button>
        <button type="button" class="reserve-step" id="reserveStepEnd">② 返却日時を選択</button>
      </div>

      <div class="reserve-selected-summary" id="reserveSelectedSummary"></div>

      <button type="button" class="reserve-edit-btn" id="reserveEditBtn" hidden>日時を変更する</button>

      <div class="reserve-selecting-area" id="reserveSelectingArea">
        <p class="reserve-date-error" id="reserveDateError" hidden></p>

        <div class="reserve-calendar-nav">
          <button type="button" class="reserve-nav-btn" id="reservePrevMonthBtn">前の2ヶ月</button>
          <button type="button" class="reserve-nav-btn" id="reserveNextMonthBtn">次の2ヶ月</button>
        </div>

        <div class="reserve-calendars" id="reserveCalendars"></div>
      </div>

      <div class="reserve-time-popup" id="reserveTimePopup" hidden>
        <div class="reserve-time-popup-inner">
          <p class="reserve-time-popup-title" id="reserveTimePopupTitle"></p>
          <div class="reserve-time-grid" id="reserveTimeGrid"></div>
          <button type="button" class="reserve-time-popup-close" id="reserveTimePopupClose">閉じる</button>
        </div>
      </div>

      <div class="reserve-price-headline" id="reservePriceHeadline" hidden></div>

      <a class="reserve-details-toggle" href="docs/rental-price-list.pdf"
         target="_blank" rel="noopener noreferrer">料金設定詳細</a>

      <div class="reserve-details-panel" id="reserveDetailsPanel" hidden aria-hidden="true">
        <div class="reserve-result" id="reserveResult"></div>
      </div>

      <div class="reserve-action-buttons" id="reserveActionButtons" hidden>
        <div class="reserve-confirm-box">
          <div class="reserve-confirm-check">
            <input type="checkbox" id="reserveConfirmCheck" aria-labelledby="reserveConfirmText">
            <span id="reserveConfirmText"><a href="docs/rental-terms.pdf" target="_blank" rel="noopener noreferrer">貸渡約款（個人情報の取扱いを含む）</a>と<a href="index.html#price" target="_blank" rel="noopener noreferrer">キャンセル規定</a>を確認しました。</span>
          </div>
          <p class="reserve-confirm-error" id="reserveConfirmError" hidden>各内容を確認し、チェックを入れてください。</p>
        </div>
        <a class="special-btn" id="reserveRequestBtn" href="#">予約リクエストフォームへ進む</a>
        <a class="special-btn" href="index.html">トップページへ戻る</a>
      </div>
    </section>

  </main>

  <script>
    (() => {
      // 料金マスター：通常期／シーズン期の時間単価（税込概算）
      const REGULAR_WEEKDAY_HOURLY = 750;     // 通常期・平日：円/時間
      const REGULAR_HOLIDAY_HOURLY = 937.5;   // 通常期・土日祝：円/時間（25%加算）
      const SEASON_WEEKDAY_HOURLY = 1500;     // シーズン期・平日：円/時間
      const SEASON_HOLIDAY_HOURLY = 1875;     // シーズン期・土日祝：円/時間（25%加算）
      const FINAL_ROUND_DOWN_UNIT = 100;      // 最終金額の切り捨て単位（円）
      const SURVEY_DISCOUNT_RATE = 0.2;       // アンケート協力割：車両利用料金に対する返金率

      // シーズン期間（毎年繰り返し・開始日終了日を含む、月日のみで判定）
      const SEASON_RANGES = [
        { startMonth: 3, startDay: 15, endMonth: 4, endDay: 10 },
        { startMonth: 4, startDay: 25, endMonth: 5, endDay: 10 },
        { startMonth: 7, startDay: 12, endMonth: 8, endDay: 31 },
        { startMonth: 9, startDay: 15, endMonth: 9, endDay: 28 },
        { startMonth: 12, startDay: 20, endMonth: 1, endDay: 15 } // 年をまたぐ期間
      ];

      function isSeasonDate(date) {
        const month = date.getMonth() + 1;
        const day = date.getDate();
        return SEASON_RANGES.some((range) => {
          if (range.startMonth <= range.endMonth) {
            return (month > range.startMonth || (month === range.startMonth && day >= range.startDay)) &&
                   (month < range.endMonth || (month === range.endMonth && day <= range.endDay));
          }
          return (month === range.startMonth && day >= range.startDay) ||
                 (month === range.endMonth && day <= range.endDay);
        });
      }

      // 日本の祝日判定（外部ライブラリ不使用）。現行の祝日法（ハッピーマンデー・春分/秋分・
      // 国民の休日・振替休日）に基づき年ごとに祝日を算出し、予約可能期間内で正しく判定する。
      function calcEquinoxDay(year, kind) {
        const base = kind === 'spring' ? 20.8431 : 23.2488;
        return Math.floor(base + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
      }

      function nthWeekdayOfMonth(year, month, nth, weekday) {
        const first = new Date(year, month - 1, 1);
        const firstWeekdayDate = 1 + ((7 + weekday - first.getDay()) % 7);
        return firstWeekdayDate + (nth - 1) * 7;
      }

      function buildHolidayMap(year) {
        const map = {};
        const set = (m, d, name) => { map[m + '-' + d] = name; };

        set(1, 1, '元日');
        set(1, nthWeekdayOfMonth(year, 1, 2, 1), '成人の日');
        set(2, 11, '建国記念の日');
        set(2, 23, '天皇誕生日');
        set(3, calcEquinoxDay(year, 'spring'), '春分の日');
        set(4, 29, '昭和の日');
        set(5, 3, '憲法記念日');
        set(5, 4, 'みどりの日');
        set(5, 5, 'こどもの日');
        set(7, nthWeekdayOfMonth(year, 7, 3, 1), '海の日');
        set(8, 11, '山の日');
        set(9, nthWeekdayOfMonth(year, 9, 3, 1), '敬老の日');
        set(9, calcEquinoxDay(year, 'autumn'), '秋分の日');
        set(10, nthWeekdayOfMonth(year, 10, 2, 1), 'スポーツの日');
        set(11, 3, '文化の日');
        set(11, 23, '勤労感謝の日');

        // 国民の休日：前後を祝日に挟まれた平日を休日とする
        let cursor = new Date(year, 0, 2);
        const yearEnd = new Date(year, 11, 30);
        while (cursor <= yearEnd) {
          const key = (cursor.getMonth() + 1) + '-' + cursor.getDate();
          if (!map[key]) {
            const prev = new Date(year, cursor.getMonth(), cursor.getDate() - 1);
            const next = new Date(year, cursor.getMonth(), cursor.getDate() + 1);
            const prevKey = (prev.getMonth() + 1) + '-' + prev.getDate();
            const nextKey = (next.getMonth() + 1) + '-' + next.getDate();
            if (map[prevKey] && map[nextKey]) {
              map[key] = '国民の休日';
            }
          }
          cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 1);
        }

        // 振替休日：日曜と重なる祝日の直後にある祝日でない日を休日とする
        Object.keys(map).sort((a, b) => {
          const [am, ad] = a.split('-').map(Number);
          const [bm, bd] = b.split('-').map(Number);
          return (am - bm) || (ad - bd);
        }).forEach((key) => {
          const [m, d] = key.split('-').map(Number);
          if (new Date(year, m - 1, d).getDay() === 0) {
            let substitute = new Date(year, m - 1, d + 1);
            while (substitute.getFullYear() === year && map[(substitute.getMonth() + 1) + '-' + substitute.getDate()]) {
              substitute = new Date(substitute.getFullYear(), substitute.getMonth(), substitute.getDate() + 1);
            }
            if (substitute.getFullYear() === year) {
              map[(substitute.getMonth() + 1) + '-' + substitute.getDate()] = '振替休日';
            }
          }
        });

        return map;
      }

      const HOLIDAY_MAP_CACHE = {};
      function isJapaneseHoliday(date) {
        const year = date.getFullYear();
        if (!HOLIDAY_MAP_CACHE[year]) {
          HOLIDAY_MAP_CACHE[year] = buildHolidayMap(year);
        }
        return !!HOLIDAY_MAP_CACHE[year][(date.getMonth() + 1) + '-' + date.getDate()];
      }

      function isWeekendOrHoliday(date) {
        const dayOfWeek = date.getDay();
        return dayOfWeek === 0 || dayOfWeek === 6 || isJapaneseHoliday(date);
      }

      function hourlyRateForDate(date) {
        const special = isWeekendOrHoliday(date);
        if (isSeasonDate(date)) {
          return special ? SEASON_HOLIDAY_HOURLY : SEASON_WEEKDAY_HOURLY;
        }
        return special ? REGULAR_HOLIDAY_HOURLY : REGULAR_WEEKDAY_HOURLY;
      }

      // 予約リクエストフォーム（Googleフォーム）への自動入力設定
      const RESERVATION_FORM_BASE_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScUqp9nXnwH3MR5jsUKwGLK9qe-9ZI--xJEMxWzOf7LN9ZURQ/viewform?usp=pp_url';
      const RESERVATION_FORM_ENTRY_ID = 'entry.1948271766';

      const stepHeaderEl = document.getElementById('reserveStepHeader');
      const stepStartEl = document.getElementById('reserveStepStart');
      const stepEndEl = document.getElementById('reserveStepEnd');
      const editBtn = document.getElementById('reserveEditBtn');
      const selectingAreaEl = document.getElementById('reserveSelectingArea');
      const dateErrorEl = document.getElementById('reserveDateError');
      const prevMonthBtn = document.getElementById('reservePrevMonthBtn');
      const nextMonthBtn = document.getElementById('reserveNextMonthBtn');
      const calendarsEl = document.getElementById('reserveCalendars');
      const summaryEl = document.getElementById('reserveSelectedSummary');
      const popupEl = document.getElementById('reserveTimePopup');
      const popupTitleEl = document.getElementById('reserveTimePopupTitle');
      const timeGridEl = document.getElementById('reserveTimeGrid');
      const popupCloseEl = document.getElementById('reserveTimePopupClose');
      const priceHeadlineEl = document.getElementById('reservePriceHeadline');
      const actionButtonsEl = document.getElementById('reserveActionButtons');
      const resultEl = document.getElementById('reserveResult');
      const reserveRequestBtn = document.getElementById('reserveRequestBtn');
      const reserveConfirmCheck = document.getElementById('reserveConfirmCheck');
      const reserveConfirmError = document.getElementById('reserveConfirmError');

      const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

      let step = 'start';
      let startDate = null;
      let endDate = null;
      let pendingDateKey = null;
      let calendarOffset = 0;
      const CALENDAR_MAX_OFFSET = 4;
      let reservationSummaryText = null;
      let view = 'selecting'; // 'selecting' | 'complete'
      // true: 完了表示からカード／「日時を変更する」で再編集中。押した側の日時だけを変更し、
      // もう一方の確定済み日時は保持する（初回のシーケンシャル入力時はfalseのまま）
      let editingMode = false;

      function pad(n) {
        return String(n).padStart(2, '0');
      }

      function formatSelected(date) {
        return date.getFullYear() + '/' + pad(date.getMonth() + 1) + '/' + pad(date.getDate()) + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
      }

      function buildMonthCalendar(year, month) {
        const wrap = document.createElement('div');
        wrap.className = 'reserve-calendar';

        const title = document.createElement('p');
        title.className = 'reserve-calendar-title';
        title.textContent = year + '年' + (month + 1) + '月';
        wrap.appendChild(title);

        const weekRow = document.createElement('div');
        weekRow.className = 'reserve-calendar-grid reserve-calendar-weekrow';
        WEEKDAY_LABELS.forEach((label) => {
          const cell = document.createElement('span');
          cell.className = 'reserve-weekday';
          cell.textContent = label;
          weekRow.appendChild(cell);
        });
        wrap.appendChild(weekRow);

        const grid = document.createElement('div');
        grid.className = 'reserve-calendar-grid';

        const firstDay = new Date(year, month, 1);
        const startOffset = firstDay.getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        for (let i = 0; i < startOffset; i++) {
          const blank = document.createElement('span');
          blank.className = 'reserve-day reserve-day-blank';
          grid.appendChild(blank);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const cellDate = new Date(year, month, d);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'reserve-day';
          btn.textContent = String(d);

          const isPast = cellDate < today;
          const isBeforeStart = step === 'end' && startDate &&
            cellDate < new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
          // 再編集で開始日時だけを変更する場合、保持中の返却日時より後の日は選べないようにする
          const isAfterEnd = editingMode && step === 'start' && endDate &&
            cellDate > new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());

          if (isPast || isBeforeStart || isAfterEnd) {
            btn.disabled = true;
            btn.classList.add('reserve-day-disabled');
          } else {
            btn.addEventListener('click', () => openTimePopup(year, month, d));
          }

          if (startDate && cellDate.getFullYear() === startDate.getFullYear() &&
              cellDate.getMonth() === startDate.getMonth() && cellDate.getDate() === startDate.getDate()) {
            btn.classList.add('reserve-day-selected-start');
          }
          if (endDate && cellDate.getFullYear() === endDate.getFullYear() &&
              cellDate.getMonth() === endDate.getMonth() && cellDate.getDate() === endDate.getDate()) {
            btn.classList.add('reserve-day-selected-end');
          }

          grid.appendChild(btn);
        }

        wrap.appendChild(grid);
        return wrap;
      }

      function renderCalendars() {
        calendarsEl.innerHTML = '';
        const base = new Date();
        for (let i = 0; i < 2; i++) {
          const target = new Date(base.getFullYear(), base.getMonth() + calendarOffset + i, 1);
          calendarsEl.appendChild(buildMonthCalendar(target.getFullYear(), target.getMonth()));
        }
        prevMonthBtn.disabled = calendarOffset <= 0;
        nextMonthBtn.disabled = calendarOffset >= CALENDAR_MAX_OFFSET;
      }

      function renderTimeGrid() {
        timeGridEl.innerHTML = '';
        for (let h = 0; h < 24; h++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'reserve-time-btn';
          if (h < 12) {
            btn.classList.add('reserve-time-am');
          } else {
            btn.classList.add('reserve-time-pm');
          }
          btn.textContent = h + '時';
          btn.addEventListener('click', () => selectTime(h));
          timeGridEl.appendChild(btn);
        }
      }

      function showDateError(message) {
        dateErrorEl.textContent = message;
        dateErrorEl.hidden = false;
      }

      function clearDateError() {
        dateErrorEl.hidden = true;
        dateErrorEl.textContent = '';
      }

      function openTimePopup(year, month, day) {
        pendingDateKey = { year, month, day };
        popupTitleEl.textContent = year + '年' + (month + 1) + '月' + day + '日の時間を選択（' + (step === 'start' ? '開始' : '返却') + '）';
        popupEl.hidden = false;
      }

      function closeTimePopup() {
        popupEl.hidden = true;
        pendingDateKey = null;
      }

      function selectTime(hour) {
        if (!pendingDateKey) {
          return;
        }

        const picked = new Date(pendingDateKey.year, pendingDateKey.month, pendingDateKey.day, hour, 0, 0, 0);

        if (step === 'start') {
          // 開始日時が返却日時以後になる組み合わせは確定しない。
          // 既存の確定済み返却日時は無効値で上書きしない
          if (endDate && picked >= endDate) {
            closeTimePopup();
            showDateError('開始日時は、返却日時（' + formatSelected(endDate) + '）より前にしてください。');
            return;
          }
          clearDateError();
          startDate = picked;
          if (editingMode) {
            // 再編集：開始日時だけを変更する。返却日時は保持し、返却選択へは自動移動しない
          } else {
            // 初回入力：返却日時の選択へ自動的に進む
            endDate = null;
            step = 'end';
          }
        } else {
          // 返却日時が開始日時以前になる組み合わせは確定しない。
          // 既存の確定済み開始日時は無効値で上書きしない
          if (startDate && picked <= startDate) {
            closeTimePopup();
            showDateError('返却日時は、開始日時（' + formatSelected(startDate) + '）より後にしてください。');
            return;
          }
          clearDateError();
          endDate = picked;
        }

        closeTimePopup();
        renderStepHeader();
        renderCalendars();
        calcPrice();

        // 開始・返却の両方が有効な組み合わせになったときだけ、完了表示へ切り替える
        if (startDate && endDate && endDate > startDate) {
          editingMode = false;
          view = 'complete';
        } else {
          view = 'selecting';
        }
        renderSummary();
        updateView();
      }

      function renderStepHeader() {
        stepStartEl.classList.toggle('is-active', step === 'start');
        stepStartEl.classList.toggle('is-done', !!startDate);
        stepEndEl.classList.toggle('is-active', step === 'end');
        stepEndEl.classList.toggle('is-done', !!endDate);
      }

      function focusCalendar() {
        calendarsEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        window.setTimeout(() => {
          calendarsEl.classList.remove('is-prompted');
          void calendarsEl.offsetWidth;
          calendarsEl.classList.add('is-prompted');
        }, 300);
        window.setTimeout(() => {
          calendarsEl.classList.remove('is-prompted');
        }, 1000);
      }

      function setStep(newStep, shouldFocusCalendar) {
        step = newStep;
        renderStepHeader();
        renderSummary();
        renderCalendars();
        if (shouldFocusCalendar) {
          focusCalendar();
        }
      }

      // 選択中／完了表示の切り替え。表示の出し分けのみで、日時計算・料金計算は一切行わない
      function updateView() {
        const complete = view === 'complete';

        stepHeaderEl.hidden = complete;
        selectingAreaEl.hidden = complete;

        editBtn.hidden = !complete;
        priceHeadlineEl.hidden = !complete;
        actionButtonsEl.hidden = !complete;
      }

      // 完了表示から選択中表示へ戻り、指定したstep（'start'/'end'）を選択中にする。
      // 「日時を変更する」ボタンと、日時カード自体の押下の両方から共通で呼び出す。
      function startEditingStep(targetStep) {
        view = 'selecting';
        step = targetStep;
        editingMode = true;
        clearDateError();
        renderStepHeader();
        renderSummary();
        renderCalendars();
        updateView();
        focusCalendar();
      }

      function renderSummary() {
        const startText = startDate ? formatSelected(startDate) : '未選択';
        const endText = endDate ? formatSelected(endDate) : '未選択';
        summaryEl.innerHTML =
          '<button type="button" class="reserve-summary-card' + (startDate ? ' is-filled' : '') + (view === 'selecting' && step === 'start' ? ' is-editing' : '') + '" data-step="start">' +
            '<p class="reserve-summary-card-label">① 利用開始</p>' +
            '<p class="reserve-summary-card-value">' + startText + '</p>' +
          '</button>' +
          '<button type="button" class="reserve-summary-card' + (endDate ? ' is-filled' : '') + (view === 'selecting' && step === 'end' ? ' is-editing' : '') + '" data-step="end">' +
            '<p class="reserve-summary-card-label">② 返却</p>' +
            '<p class="reserve-summary-card-value">' + endText + '</p>' +
          '</button>';
      }

      // 表示用：時間数を「○日○時間」の形式に変換する（1日＝24時間）。料金計算には使用しない。
      function formatHoursAsDaysAndHours(totalHours) {
        const days = Math.floor(totalHours / 24);
        const hours = totalHours % 24;
        if (days === 0) {
          return hours + '時間';
        }
        if (hours === 0) {
          return days + '日';
        }
        return days + '日' + hours + '時間';
      }

      function calcPrice() {
        reservationSummaryText = null;

        if (!startDate || !endDate) {
          resultEl.innerHTML = '';
          priceHeadlineEl.innerHTML = '';
          return;
        }

        if (endDate <= startDate) {
          resultEl.innerHTML = '<p class="reserve-result-detail">返却日時は利用開始日時より後にしてください。</p>';
          priceHeadlineEl.innerHTML = '';
          return;
        }

        const usageHours = Math.round((endDate - startDate) / (1000 * 60 * 60));

        let regularHours = 0;
        let seasonHours = 0;
        let specialHours = 0;
        let calculatedAmount = 0;
        let regularWeekdayHours = 0;
        let regularHolidayHours = 0;
        let seasonWeekdayHours = 0;
        let seasonHolidayHours = 0;

        for (let i = 0; i < usageHours; i++) {
          const hourStart = new Date(startDate.getTime() + i * 60 * 60 * 1000);
          const season = isSeasonDate(hourStart);
          const special = isWeekendOrHoliday(hourStart);

          if (season) {
            seasonHours++;
          } else {
            regularHours++;
          }
          if (special) {
            specialHours++;
          }

          if (season) {
            if (special) {
              seasonHolidayHours++;
            } else {
              seasonWeekdayHours++;
            }
          } else if (special) {
            regularHolidayHours++;
          } else {
            regularWeekdayHours++;
          }

          calculatedAmount += season
            ? (special ? SEASON_HOLIDAY_HOURLY : SEASON_WEEKDAY_HOURLY)
            : (special ? REGULAR_HOLIDAY_HOURLY : REGULAR_WEEKDAY_HOURLY);
        }

        let amountBeforeRounding = calculatedAmount;
        let minimumApplied = false;
        let minimumCharge = null;
        if (usageHours < 24) {
          minimumCharge = hourlyRateForDate(startDate) * 24;
          if (minimumCharge > calculatedAmount) {
            amountBeforeRounding = minimumCharge;
            minimumApplied = true;
          }
        }

        const total = Math.floor(amountBeforeRounding / FINAL_ROUND_DOWN_UNIT) * FINAL_ROUND_DOWN_UNIT;
        const surveyRefund = Math.floor(total * SURVEY_DISCOUNT_RATE);
        const netAfterRefund = total - surveyRefund;

        const regularWeekdayLine = regularWeekdayHours > 0
          ? '<p class="reserve-result-detail"><strong>通常期平日（' + (REGULAR_WEEKDAY_HOURLY * 24).toLocaleString('ja-JP') + '円／日）：</strong>' + formatHoursAsDaysAndHours(regularWeekdayHours) + '　' + (regularWeekdayHours * REGULAR_WEEKDAY_HOURLY).toLocaleString('ja-JP') + '円</p>'
          : '';
        const regularHolidayLine = regularHolidayHours > 0
          ? '<p class="reserve-result-detail"><strong>通常期土日祝（' + (REGULAR_HOLIDAY_HOURLY * 24).toLocaleString('ja-JP') + '円／日）：</strong>' + formatHoursAsDaysAndHours(regularHolidayHours) + '　' + (regularHolidayHours * REGULAR_HOLIDAY_HOURLY).toLocaleString('ja-JP') + '円</p>'
          : '';
        const seasonWeekdayLine = seasonWeekdayHours > 0
          ? '<p class="reserve-result-detail"><strong>人気期平日（' + (SEASON_WEEKDAY_HOURLY * 24).toLocaleString('ja-JP') + '円／日）：</strong>' + formatHoursAsDaysAndHours(seasonWeekdayHours) + '　' + (seasonWeekdayHours * SEASON_WEEKDAY_HOURLY).toLocaleString('ja-JP') + '円</p>'
          : '';
        const seasonHolidayLine = seasonHolidayHours > 0
          ? '<p class="reserve-result-detail"><strong>人気期土日祝（' + (SEASON_HOLIDAY_HOURLY * 24).toLocaleString('ja-JP') + '円／日）：</strong>' + formatHoursAsDaysAndHours(seasonHolidayHours) + '　' + (seasonHolidayHours * SEASON_HOLIDAY_HOURLY).toLocaleString('ja-JP') + '円</p>'
          : '';

        resultEl.innerHTML =
          '<p class="reserve-result-label">概算料金</p>' +
          '<p class="reserve-result-price">' + total.toLocaleString('ja-JP') + '円</p>' +
          '<p class="reserve-result-detail"><strong>利用時間：</strong>' + formatHoursAsDaysAndHours(usageHours) + '（通常期 ' + formatHoursAsDaysAndHours(regularHours) + ' / 人気期 ' + formatHoursAsDaysAndHours(seasonHours) + '）</p>' +
          '<p class="reserve-result-detail"><strong>土日祝加算：</strong>' + (specialHours > 0 ? '対象 ' + formatHoursAsDaysAndHours(specialHours) + '（該当時間帯を25%加算して計算）' : 'なし') + '</p>' +
          '<p class="reserve-result-detail"><strong>1日＝24時間。</strong>24時間を超えた部分は1時間単位で計算します。</p>' +
          regularWeekdayLine +
          regularHolidayLine +
          seasonWeekdayLine +
          seasonHolidayLine +
          '<p class="reserve-result-detail"><strong>最低料金の適用：</strong>' + (minimumApplied ? 'あり（利用開始日の24時間料金を適用）' : 'なし') + '</p>' +
          (minimumApplied
            ? '<p class="reserve-result-detail"><strong>24時間最低料金との差額：</strong>' + (minimumCharge - calculatedAmount).toLocaleString('ja-JP') + '円（実計算額 ' + calculatedAmount.toLocaleString('ja-JP') + '円 → 最低料金 ' + minimumCharge.toLocaleString('ja-JP') + '円）</p>'
            : '') +
          '<p class="reserve-result-detail">内訳合計（丸め前）：' + amountBeforeRounding.toLocaleString('ja-JP') + '円 → <strong>100円未満切り捨て後の合計：</strong>' + total.toLocaleString('ja-JP') + '円</p>' +
          '<p class="reserve-result-detail"><strong>アンケート協力割：</strong>利用後に自社アンケートの回答を確認し、車両利用料金の20％を銀行振込で返金します。先着10組限定・残り8組（2026年9月11日時点）</p>' +
          '<p class="reserve-result-detail"><strong>予定返金額：</strong>' + surveyRefund.toLocaleString('ja-JP') + '円 / <strong>返金後の実質負担額：</strong>' + netAfterRefund.toLocaleString('ja-JP') + '円</p>';

        // 完了表示の見出しに概算料金を表示する（#reserveResultの内容・構造は変更しない。表示用の複製）
        priceHeadlineEl.innerHTML =
          '<p class="reserve-result-label">概算料金</p>' +
          '<p class="reserve-result-price">' + total.toLocaleString('ja-JP') + '円</p>';

        // 予約リクエストフォームへ渡す文章：画面表示中の料金内訳をそのまま利用する（計算のやり直しはしない）
        const displayedBreakdownLines = Array.from(resultEl.children).map((el) => el.textContent);
        reservationSummaryText = [
          '【ご予約内容】',
          '出発日時：' + formatSelected(startDate),
          '返却日時：' + formatSelected(endDate),
          '利用日数と時間：' + formatHoursAsDaysAndHours(usageHours),
          '概算料金：' + total.toLocaleString('ja-JP') + '円',
          'アンケート協力割の適用状況：予定返金額 ' + surveyRefund.toLocaleString('ja-JP') + '円 / 返金後の実質負担額 ' + netAfterRefund.toLocaleString('ja-JP') + '円',
          '',
          '【画面表示の料金内訳】'
        ].concat(displayedBreakdownLines).join('\n');
      }

      function buildReservationGuidanceMessage() {
        if (!startDate) {
          return '予約リクエストに進む前に、開始日時を選択してください。';
        }
        if (!endDate) {
          return '予約リクエストに進む前に、返却日時を選択してください。';
        }
        if (endDate <= startDate) {
          return '返却日時は利用開始日時より後にしてください。';
        }
        return '予約リクエストに進む前に、料金の計算結果を表示してください。';
      }

      reserveRequestBtn.addEventListener('click', (event) => {
        event.preventDefault();
        if (!reservationSummaryText) {
          resultEl.innerHTML = '<p class="reserve-result-detail">' + buildReservationGuidanceMessage() + '</p>';
          return;
        }
        if (!reserveConfirmCheck.checked) {
          reserveConfirmError.hidden = false;
          reserveConfirmCheck.focus();
          return;
        }
        reserveConfirmError.hidden = true;
        const formUrl = RESERVATION_FORM_BASE_URL + '&' + RESERVATION_FORM_ENTRY_ID + '=' + encodeURIComponent(reservationSummaryText);
        window.open(formUrl, '_blank', 'noopener,noreferrer');
      });

      reserveConfirmCheck.addEventListener('change', () => {
        if (reserveConfirmCheck.checked) {
          reserveConfirmError.hidden = true;
        }
      });

      popupCloseEl.addEventListener('click', closeTimePopup);
      stepStartEl.addEventListener('click', () => setStep('start', true));
      stepEndEl.addEventListener('click', () => setStep('end', true));
      editBtn.addEventListener('click', () => startEditingStep('start'));
      // 完了表示の日時カード自体を押しても、対応するstepを選択中にして再編集へ入れるようにする
      summaryEl.addEventListener('click', (event) => {
        const card = event.target.closest('.reserve-summary-card');
        if (!card) {
          return;
        }
        startEditingStep(card.dataset.step === 'end' ? 'end' : 'start');
      });
      prevMonthBtn.addEventListener('click', () => {
        calendarOffset = Math.max(0, calendarOffset - 2);
        renderCalendars();
      });
      nextMonthBtn.addEventListener('click', () => {
        calendarOffset = Math.min(CALENDAR_MAX_OFFSET, calendarOffset + 2);
        renderCalendars();
      });

      renderTimeGrid();
      renderStepHeader();
      renderSummary();
      renderCalendars();
      updateView();
    })();
  </script>

</body>
</html>
